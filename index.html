<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Sacramento&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8fa; --card:#fffdfd; --ink:#6b5a68; --soft:#b9a3b5;
  --pink:#ffc8dd;--bord:#f5b5cd; --lav:#cdb4f6; --mint:#b8e8d8; --peach:#ffd9b8; --sky:#bde0fe;
  --env:#fde4ec; --env2:#f8d2e0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#2a2230;--card:#352c3c;--ink:#f1e3ee;--soft:#c9b3c6;--env:#4a3a52;--env2:#3f3147}
}
:root[data-theme="dark"]{--bg:#2a2230;--card:#352c3c;--ink:#f1e3ee;--soft:#c9b3c6;--env:#4a3a52;--env2:#3f3147}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;overflow-x:hidden}
body.locked{overflow:hidden;height:100%}
/* To use the real fonts, paste base64 into the url(...) below: url(data:font/ttf;base64,XXXX) */
@font-face{font-family:'Cassandra';src:local('Cassandra');font-display:swap}
@font-face{font-family:'Beautiful People';src:local('Beautiful People');font-display:swap}
.script{font-family:'Cassandra','Great Vibes',cursive;font-weight:400}
.hand{font-family:'Beautiful People','Sacramento',cursive;font-weight:400}

/* floating hearts */
#floaty{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#floaty i{position:absolute;bottom:-40px;font-style:normal;opacity:.5;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}

/* intro */
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--bg);transition:opacity 1s ease,transform 1.2s ease;touch-action:none}
#intro.leave{opacity:0;transform:scale(2.2);pointer-events:none}
#intro h1{margin:0;font-size:clamp(34px,9vw,52px);color:var(--soft);text-align:center;line-height:1.2}
.scene{touch-action:none;perspective:900px;width:min(84vw,360px);aspect-ratio:3/2;position:relative}
.env{position:absolute;inset:0;border-radius:10px;background:var(--env2);border:3px solid transparent;
  background:linear-gradient(var(--env2),var(--env2)) padding-box,linear-gradient(var(--bord),var(--bord)) border-box;
  box-shadow:0 14px 30px rgba(190,140,170,.25)}
.paper{position:absolute;left:8%;right:8%;top:6%;height:80%;background:var(--card);border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:30px;color:var(--soft);transition:transform .9s cubic-bezier(.2,.8,.2,1);z-index:1}
.pocket{position:absolute;inset:0;z-index:2;border-radius:10px;pointer-events:none;
  background:linear-gradient(var(--env),var(--env));clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:3;transform-origin:top center;cursor:grab;touch-action:none;
  background:linear-gradient(180deg,var(--pink),var(--env));clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0}
.seal svg{width:46px;height:46px;display:block;filter:drop-shadow(0 3px 4px rgba(229,143,176,.55))}
.seal{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);font-size:26px;pointer-events:none;transition:opacity .3s}
.scene.open .paper{transform:translateY(-34%)}
.scene.open .flap{z-index:0}
.scene.open .seal{opacity:0}

.hint{font-family:'Beautiful People','Sacramento',cursive;font-size:20px!important;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--soft);font-size:14px;letter-spacing:.04em}
.hint .arr{font-size:22px;line-height:1;animation:nudge 1.4s ease-in-out infinite}
.hint .arr:nth-child(2){animation-delay:.18s;opacity:.7}
.hint .arr:nth-child(3){animation-delay:.36s;opacity:.4}
@keyframes nudge{0%,100%{transform:translateY(4px)}50%{transform:translateY(-6px)}}

/* letter */
#letter{position:relative;z-index:1;display:none;padding:12vh 20px 18vh;max-width:560px;margin:0 auto}
#letter.show{display:block}
.frame{border:4px solid transparent;border-radius:28px;padding:34px 26px;margin:0 0 22vh;text-align:center;
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(var(--bord),var(--bord)) border-box;
  opacity:0;transform:scale(.55);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.9,.25,1.05)}
.frame.in{opacity:1;transform:scale(1)}
.frame h2{margin:0 0 14px;font-size:clamp(40px,11vw,60px);color:var(--ink);line-height:1.1}
.frame p{margin:0;font-size:18px;line-height:1.75}
.frame.photo{padding:14px 14px 22px;border-radius:20px;rotate:-2deg}
.frame.photo:nth-of-type(even){rotate:2deg}
.frame.photo .ph{aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--pink),var(--sky));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.frame.photo img{width:100%;height:100%;object-fit:cover;display:block}
.frame.photo .cap{margin-top:14px;font-size:30px;color:var(--soft)}
.end{text-align:center;font-size:clamp(34px,9vw,48px);color:var(--soft)}

.grp{margin:0 0 22vh;text-align:center;opacity:0;transform:scale(.55);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.9,.25,1.05)}
.grp.in{opacity:1;transform:scale(1)}
.grp h2{margin:0 0 4px;font-size:clamp(38px,10vw,56px);line-height:1.1}
.sub{font-size:22px;color:var(--soft);margin-bottom:18px}
.big{font-size:54px;margin-bottom:6px}
.frame.end{margin-bottom:0}.frame.end h2{font-size:clamp(34px,9vw,48px)}
.note{display:block;width:100%;margin:0 0 12px;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;border:3px solid transparent;border-radius:20px;
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(var(--bord),var(--bord)) border-box}
.note .t{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;font-size:28px}
.note .t b{font-weight:400;color:var(--pink);transition:transform .7s cubic-bezier(.22,1,.36,1)}
.note.open .t b{transform:rotate(135deg) scale(1.2)}
.note .b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s cubic-bezier(.22,1,.36,1)}
.note.open .b{grid-template-rows:1fr}
.note .b>span{display:block;overflow:hidden;min-height:0}
.note .p{display:block;padding:0 20px 18px;font-size:17px;line-height:1.7;opacity:0;transform:translateY(-6px);transition:opacity .7s ease-out,transform .7s ease-out}
.note.open .p{opacity:1;transform:none}
.hugscene{position:relative;width:100%;max-width:340px;aspect-ratio:34/43;margin:34px auto 0}
.hugscene .arrow{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hugscene .art{position:absolute;right:0;top:0;width:62%;aspect-ratio:1;rotate:3deg;border:3px solid var(--bord);border-radius:26px;background:var(--env);padding:10px 8px 28px}
.hugscene .art svg{width:100%;height:100%;display:block}
.who{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:17px;color:var(--soft)}
.hugscene .pic{position:absolute;left:0;bottom:0;width:52%;aspect-ratio:1;border-radius:50%;border:3px solid var(--bord);overflow:hidden;background:var(--env);display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:20px;text-align:center}
.hugscene .pic img{width:100%;height:100%;object-fit:cover;display:block}
.frame.photo img{object-position:50% 38%}
.hugscene .pic img{object-position:50% 20%}
.nimg{display:block;width:78%;aspect-ratio:1329/1080;margin:0 auto 20px;rotate:2deg;border:3px solid var(--bord);border-radius:18px;background:var(--env);overflow:hidden;opacity:0;transform:translateY(-6px);transition:opacity .8s ease-out .1s,transform .8s ease-out .1s}
.nimg img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.note.open .nimg{opacity:1;transform:none}
.frame.photo.small{position:relative;width:58%;margin-left:6%;margin-right:auto;rotate:-3deg}
.frame.photo.small::after{content:"♡";position:absolute;top:-14px;right:-10px;font-size:30px;color:var(--bord)}
#music{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:9;width:44px;height:44px;border-radius:50%;
  border:3px solid transparent;font-size:18px;color:var(--ink);cursor:pointer;display:none;
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(var(--bord),var(--bord)) border-box}
#music.on{display:block}
#music.playing{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body class="locked">
<div id="floaty"></div>

<section id="intro">
  <h1 class="script">For Nayonika ♡</h1>
  <div class="scene" id="scene">
    <div class="env"></div>
    <div class="paper">♡</div>
    <div class="pocket"></div>
    <div class="flap" id="flap" role="button" tabindex="0" aria-label="Open the envelope"></div>
    <div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="#e58fb0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5C5 15.8 3 12.4 3 9.3 3 6.9 4.8 5 7.2 5c1.9 0 3.6 1 4.8 2.8C13.2 6 14.9 5 16.8 5 19.2 5 21 6.9 21 9.3c0 3.1-2 6.5-9 11.2z"/></svg></div>
  </div>
  <div class="hint"><span class="arr">⌃</span><span class="arr">⌃</span><span class="arr">⌃</span><span>swipe the flap up</span></div>
</section>

<main id="letter"></main>
<button id="music" aria-label="Toggle music">♪</button>
<audio id="bgm" loop preload="auto"></audio>

<script>
/* ====== EDIT THIS PART ====== */
const IMG = {
  us:"asset/1.jpg",
  hug:"asset/4.jpg",
  p1:"asset/3.jpg",
  p2:"asset/7.webp",
  p3:"asset/6.webp"
};
const CONFIG = {
  music: "asset/song.mp3",   // <- change to your exact song file name
  items: [
    { type:"message", heading:"365 days with you", text:"It's already been 365 days together, yet it feels like only yesterday we spoke for the first time. In the beginning it was simple feelings, but today it's like I can't live without you." },
    { type:"photo", src:IMG.us, caption:"my beauty" },
    { type:"message", heading:"Our story begins", text:"It began when I asked Sana if she could introduce me to a friend, and she told me about you. The most beautiful girl I have ever met. Then came our first chat, and it was clear that you were totally mad in love." },
    { type:"message", heading:"Because of you", text:"Now I feel it is really you alone because of whom our relationship exists. You are the most important person in my life, the one who has taught me about love, care, affection and every other beautiful quality of a human being." },
    { type:"group", heading:"What I love most about you", sub:"tap a note to open it", notes:[
      {t:"Your smile", p:"Your smile makes even my worst day better. One look at it and every heavy thought simply melts away, and I forget whatever was bothering me."},
      {t:"Your voice", p:"Your sweet voice calms everything that goes on inside me. Even when my mind is a storm, hearing you say my name brings me back to peace."},
      {t:"Your eyes", p:"The most beautiful thing I have ever seen in my life. On this very day a year ago, when I saw you in assembly, your eyes took my heart away completely, dear. I could write a whole book on your eyes, and still never finish.", img:IMG.p2} ]},
    { type:"photo", src:IMG.p1, caption:"your smile" },
    { type:"group", heading:"Our best moments", sub:"tap a note to open it", notes:[
      {t:"Our first hug 🫂", p:"The intensity of that hug made everything calm, and its warmth melted away the coldness and every nervous feeling in my heart ❤️. When your heart touched my chest, it felt like becoming one human with two heartbeats, finally complete."},
      {t:"Made with you", p:"The best moments are only made because they are made with the best person, you, Nayonika ji. Every ordinary day turns special the moment you are in it."} ],
      scene:{ photo:IMG.hug, him:"Dinaksh", nick:"Dinu", her:"Nayonika" } },
    { type:"group", heading:"What I dream with you", sub:"my whole life with you, lovely and cute", notes:[
      {t:"Mornings", p:"Waking up next to each other, sleepy and smiling, and starting our day together with you by my side."},
      {t:"Afternoons", p:"Spending our afternoons watching K-dramas together, close and cozy, lost in our favourite stories."},
      {t:"Evenings", p:"Spending our evenings cooking snacks together, laughing in the kitchen and tasting everything we make."},
      {t:"Nights", p:"Listening to songs and watching the stars and the moon together, then falling asleep cuddled up, till the next cute morning."} ]},
    { type:"photo", small:true, src:IMG.p3, caption:"my forever" },
    { type:"seal", icon:"♾️", text:"Our bond remains forever." },
    { type:"quote", text:"Every love story is good, but ours is perfect.", by:"The story: From Strangers to Love Birds 🦚🕊️" }
  ],
  ending: "I love you soo much, always and all ♡",
  sign: "— Dinaksh, your Dinu",
  song: "♪ Love You With All My Heart (MV) · Crush · Queen of Tears"
};
/* ============================ */

const $ = s => document.querySelector(s);
const scene=$('#scene'), flap=$('#flap'), intro=$('#intro'), letter=$('#letter'), bgm=$('#bgm'), mbtn=$('#music');

// background hearts
const fl=$('#floaty'), glyphs=['♡','✿','♡','·'], cols=['var(--pink)','var(--lav)','var(--mint)','var(--peach)'];
for(let i=0;i<14;i++){const e=document.createElement('i');e.textContent=glyphs[i%4];
  e.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*16}px;color:${cols[i%4]};animation-duration:${14+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;fl.appendChild(e)}

// build letter
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const note=n=>`<button class="note" aria-expanded="false"><span class="t script">${esc(n.t)}<b>♡</b></span><span class="b"><span><span class="p">${esc(n.p)}</span>${n.img?`<span class="nimg"><img src="${n.img}" alt=""></span>`:''}</span></span></button>`;
const COUPLE=`<svg viewBox="0 0 200 200" fill="none" stroke="#e58fb0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A cute couple hugging"><path fill="var(--env)" d="M68 86Q58 92 56 130L54 180H102L100 130Q100 94 92 86Z"/><path fill="var(--env)" d="M106 76Q94 82 94 130V180H146V130Q146 82 134 76Z"/><path d="M92 106Q118 130 140 110"/><circle cx="140" cy="110" r="3.2" fill="var(--env)"/><path d="M102 102Q80 126 60 110"/><circle cx="60" cy="110" r="3.2" fill="var(--env)"/><circle cx="80" cy="68" r="17" fill="var(--env)"/><circle cx="72" cy="48" r="6" fill="var(--env)"/><path d="M64 64Q66 50 82 50Q94 50 97 62"/><circle cx="118" cy="58" r="19" fill="var(--env)"/><path d="M100 54Q104 38 120 39Q134 40 136 56"/><path d="M72 70q3 3 6 0M86 70q3 3 6 0M78 77q4 3 8 0M108 60q3 3 6 0M122 60q3 3 6 0M114 67q4 3 8 0"/><g fill="#e58fb0" stroke="none" opacity=".4"><ellipse cx="70" cy="76" rx="4" ry="2.5"/><ellipse cx="92" cy="76" rx="4" ry="2.5"/><ellipse cx="105" cy="66" rx="4" ry="2.5"/><ellipse cx="131" cy="66" rx="4" ry="2.5"/></g><g fill="#e58fb0" stroke="none"><text x="146" y="38" font-size="16">♡</text><text x="34" y="46" font-size="11">♡</text><text x="160" y="64" font-size="10">♡</text></g></svg>`;
const hugScene=c=>`<div class="hugscene"><svg class="arrow" viewBox="0 0 340 430" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#e58fb0" stroke-width="1.6" stroke-linecap="round"/></marker></defs><path d="M122 96C30 66 14 190 88 226" fill="none" stroke="#e58fb0" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 9" marker-end="url(#ah)"/></svg><div class="art">${COUPLE}<div class="who hand">${esc(c.him)} (${esc(c.nick)}) &amp; ${esc(c.her)}</div></div><div class="pic">${c.photo?`<img src="${c.photo}" alt="">`:'<span class="hand">♡ her photo ♡</span>'}</div></div>`;
const build=it=>{
  if(it.type==='photo')return `<div class="frame photo${it.small?' small':''}"><div class="ph">${it.src?`<img src="${it.src}" alt="">`:'♡ photo ♡'}</div><div class="cap hand">${esc(it.caption||'')}</div></div>`;
  if(it.type==='group')return `<div class="grp"><h2 class="script">${esc(it.heading)}</h2><div class="sub hand">${esc(it.sub||'')}</div>${it.notes.map(note).join('')}${it.scene?hugScene(it.scene):''}</div>`;
  if(it.type==='seal')return `<div class="frame"><div class="big">${it.icon}</div><p class="hand" style="font-size:30px">${esc(it.text)}</p></div>`;
  if(it.type==='quote')return `<div class="frame"><h2 class="script" style="font-size:clamp(34px,9vw,48px)">${esc(it.text)}</h2><p class="hand" style="font-size:24px">${esc(it.by)}</p></div>`;
  return `<div class="frame"><h2 class="script">${esc(it.heading)}</h2><p>${esc(it.text)}</p></div>`;
};
letter.innerHTML=CONFIG.items.map(build).join('')+`<div class="frame end"><h2 class="hand">${esc(CONFIG.ending)}</h2><p class="hand" style="font-size:28px;margin-bottom:6px">${esc(CONFIG.sign)}</p><p class="hand" style="font-size:20px;color:var(--soft)">${esc(CONFIG.song)}</p></div>`;
letter.addEventListener('click',e=>{const n=e.target.closest('.note');if(n){const o=n.classList.toggle('open');n.setAttribute('aria-expanded',o)}});

// swipe-to-open
let startY=null, p=0, opened=false;
const setP=v=>{p=Math.max(0,Math.min(1,v));flap.style.transform=`rotateX(${-p*180}deg)`;flap.style.zIndex=p>.5?0:3};
scene.addEventListener('pointerdown',e=>{startY=e.clientY;scene.setPointerCapture(e.pointerId);flap.style.transition='none'});
scene.addEventListener('pointermove',e=>{if(startY!==null&&!opened)setP((startY-e.clientY)/110)});
const end=()=>{if(startY===null)return;startY=null;flap.style.transition='transform .5s ease';(p>.45||p<.02&&false)?openIt():setP(0)};
scene.addEventListener('pointerup',e=>{const tap=startY!==null&&Math.abs(startY-e.clientY)<6;tap?(startY=null,openIt()):end()});
scene.addEventListener('pointercancel',end);
flap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openIt()});

function openIt(){
  if(opened)return;opened=true;
  flap.style.transition='transform .6s ease';setP(1);scene.classList.add('open');
  if(CONFIG.music){bgm.src=CONFIG.music;bgm.play().then(()=>{mbtn.classList.add('playing')}).catch(()=>{});mbtn.classList.add('on')}
  setTimeout(()=>intro.classList.add('leave'),1500);
  setTimeout(()=>{document.body.classList.remove('locked');letter.classList.add('show');intro.style.display='none';observe()},2500);
}
mbtn.onclick=()=>{if(bgm.paused){bgm.play();mbtn.classList.add('playing')}else{bgm.pause();mbtn.classList.remove('playing')}};


function observe(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{e.target.classList.toggle('in',e.isIntersecting)}),{threshold:.25});
  document.querySelectorAll('.frame,.grp').forEach(f=>io.observe(f));
}
</script>
</body>
</html>
